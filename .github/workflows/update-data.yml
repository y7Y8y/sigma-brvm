name: SIGMA — collecte BRVM quotidienne

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = collecte complète · probe = diagnostic 2 min, sans écrire"
        type: choice
        options: [daily, probe]
        default: daily
      boc_count:
        description: "BOC récents à relire (daily)"
        default: "30"
      boc_archive_count:
        description: "Profondeur d'archive visée, en séances (daily)"
        default: "260"
  schedule:
    # 18:20 UTC = 18:20 à Abidjan, après clôture. Lun–ven.
    - cron: "20 18 * * 1-5"
    # Seconde tentative si le BOC du jour paraît plus tard.
    - cron: "20 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: sigma-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Une collecte coupée à 4 h n'écrit rien du tout : c'est ce qui a laissé
    # les données figées. Le plafond utile d'un job est de 6 h.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer OCR de repli (PDF officiels scannés)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra poppler-utils imagemagick
          tesseract --version
          pdftoppm -v
          magick -version
      - name: Restaurer les PDF déjà lus et le cache OCR
        # Les BOC sont téléchargés puis extraits à chaque exécution, et les
        # documents émetteurs passent par OCR en repli (24 pages à 300 dpi par
        # document). Sans persistance, chaque run repaie tout : c'est ce qui a
        # fait dépasser 4 h. La clé change à chaque run, la restauration est
        # incrémentale : on repart du cache le plus récent.
        uses: actions/cache@v4
        with:
          path: |
            /tmp/sigma-boc-cache
            /tmp/sigma-reports-cache
          key: sigma-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sigma-cache-${{ runner.os }}-
      - name: Installer les dépendances de collecte
        run: pip install -r sigma-app/requirements.txt
      - name: Tester les parseurs et calculs
        run: python -m unittest discover -s sigma-app/tests -v
      - name: Sonde des sources (mode probe) — joignabilité, débit, profondeur
        if: ${{ github.event.inputs.mode == 'probe' }}
        # Le journal d'un job n'est pas lisible depuis l'extérieur du runner :
        # la sonde écrit donc son rapport dans le dépôt, où il est lisible.
        run: |
          mkdir -p sigma-app/audits/sonde
          python sigma-app/tools/probe_sources.py | tee "sigma-app/audits/sonde/$(date -u +%Y-%m-%d).txt"
      - name: Publier le rapport de sonde
        if: ${{ always() && github.event.inputs.mode == 'probe' }}
        run: |
          git config user.name "sigma-data-bot"
          git config user.email "sigma-data-bot@users.noreply.github.com"
          git add sigma-app/audits/sonde/ || true
          git commit -m "sonde: mesures des sources officielles" || echo "rien à publier"
          git push || echo "push impossible (branche protégée ou rien à pousser)"
      - name: Collecter les sources officielles BRVM
        if: ${{ github.event.inputs.mode != 'probe' }}
        # Le journal est horodaté étape par étape : si la collecte touche le
        # plafond, on sait quelle étape a coûté le temps et combien de BOC ont
        # été lus. Sans cela, la seule information est « annulé ».
        run: |
          python -u sigma-app/ingestion/collect.py \
            --boc-count "${{ github.event.inputs.boc_count || 30 }}" \
            --boc-archive-count "${{ github.event.inputs.boc_archive_count || 260 }}"
      - name: Régénérer les verdicts depuis les données fraîches
        if: ${{ github.event.inputs.mode != 'probe' }}
        run: |
          python sigma-app/ingestion/verdict.py --out sigma-app/web/data/verdicts.json
          python sigma-app/ingestion/trajectoire.py || echo "trajectoire : pas de régénération"
      - name: Publier uniquement si les données ont changé
        # `always()` : une collecte qui a écrit l'archive puis échoue plus loin
        # (documents, réseau) doit quand même publier ce qu'elle a acquis. Sans
        # cela, un échec tardif jette des heures de lecture.
        if: ${{ always() && github.event.inputs.mode != 'probe' }}
        run: |
          if git diff --quiet -- sigma-app/web/data/; then
            echo "Aucun changement de données."
            exit 0
          fi
          git config user.name "sigma-data-bot"
          git config user.email "sigma-data-bot@users.noreply.github.com"
          git add sigma-app/web/data/
          git commit -m "data: collecte BRVM officielle et verdicts régénérés"
          git push
