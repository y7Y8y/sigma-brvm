name: SIGMA — collecte BRVM quotidienne

# Ce fichier doit vivre à la RACINE du dépôt (.github/workflows/).
# L'application est dans sigma-app/ : tous les chemins passent par working-directory.
#
# DÉSACTIVÉ PAR DÉFAUT : aucun déclencheur automatique n'est armé tant que
# `SIGMA_COLLECTE_ACTIVE` ne vaut pas "oui" dans les variables du dépôt.
# Décision du 24/10/2026 : activation après la v1.5. Ce garde-fou évite qu'un
# push sur main réécrive silencieusement les données publiées.

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * 1-5"
    - cron: "20 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: sigma-data
  cancel-in-progress: false

defaults:
  run:
    working-directory: sigma-app

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que la collecte est autorisée
        run: |
          if [ "${{ vars.SIGMA_COLLECTE_ACTIVE }}" != "oui" ]; then
            echo "Collecte non armée (SIGMA_COLLECTE_ACTIVE != oui). Arrêt volontaire."
            exit 0
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sigma-app/requirements.txt

      - name: Installer OCR de repli (PDF officiels scannés)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra poppler-utils imagemagick
          tesseract --version
          pdftoppm -v
          magick -version || convert -version

      - name: Restaurer le cache OCR par empreinte PDF
        uses: actions/cache@v4
        with:
          path: /tmp/sigma-boc-cache/reports/ocr
          key: sigma-ocr-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sigma-ocr-${{ runner.os }}-

      - name: Installer les dépendances de collecte
        run: pip install -r requirements.txt

      - name: Tester les parseurs et calculs
        run: python -m unittest discover -s tests -v

      - name: Collecter les sources officielles BRVM
        run: python ingestion/collect.py --boc-count 30 --boc-archive-count 260

      - name: Publier uniquement si les données ont changé
        run: |
          if git diff --quiet -- sigma-app/web/data/data.json sigma-app/web/data/boc_archive.json; then
            echo "Aucun changement de données."
            exit 0
          fi
          git config user.name "sigma-data-bot"
          git config user.email "sigma-data-bot@users.noreply.github.com"
          git add sigma-app/web/data/data.json sigma-app/web/data/boc_archive.json
          git commit -m "data: collecte BRVM officielle"
          git push
